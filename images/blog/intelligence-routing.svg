<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="860" viewBox="0 0 1540 860" role="img" aria-labelledby="title desc">
  <title id="title">Intelligent model routing</title>
  <desc id="desc">A request is analyzed by a confidence-aware router, sent to a small, mid-tier, or frontier model, checked for quality and safety, and returned. Evaluation and cost feedback tune future routing decisions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0F172A; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #475569; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 11px; fill: #475569; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .line { fill: none; stroke: #64748B; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .route { fill: none; stroke: #2563EB; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .feedback { fill: none; stroke: #0F766E; stroke-width: 2; stroke-dasharray: 7 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    </style>
  </defs>

  <rect width="1540" height="860" fill="#F7F9FC"/>
  <text x="48" y="58" class="title">Intelligent Model Routing</text>
  <text x="49" y="86" class="subtitle">Match each request to the least-cost model that meets the quality bar.</text>
  <rect x="1318" y="38" width="174" height="30" rx="15" fill="#E2E8F0"/>
  <text x="1405" y="57" text-anchor="middle" class="eyebrow" fill="#334155">GENERIC REFERENCE FLOW</text>

  <!-- Request -->
  <rect x="42" y="262" width="226" height="254" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="42" y="262" width="226" height="8" rx="4" fill="#64748B"/>
  <circle cx="75" cy="309" r="17" fill="#E2E8F0"/>
  <path d="M67 306h16M67 312h11" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <text x="101" y="315" class="card-title">Incoming request</text>
  <text x="64" y="356" class="body">Prompt + relevant context</text>
  <text x="64" y="386" class="body">Task type and constraints</text>
  <text x="64" y="416" class="body">User / application policy</text>
  <line x1="64" y1="439" x2="246" y2="439" stroke="#E2E8F0"/>
  <text x="64" y="466" class="small">One request enters the router</text>
  <text x="64" y="487" class="small">with its operating context.</text>

  <!-- Router -->
  <rect x="320" y="222" width="310" height="334" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.7"/>
  <rect x="320" y="222" width="310" height="8" rx="4" fill="#2563EB"/>
  <circle cx="354" cy="270" r="17" fill="#DBEAFE"/>
  <path d="M347 270h14M354 263v14M349 265l10 10M359 265l-10 10" stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="380" y="276" class="card-title">Intelligent router</text>
  <text x="344" y="315" class="eyebrow" fill="#1D4ED8">ASSESS</text>
  <text x="344" y="341" class="body">Complexity · task type · risk</text>
  <text x="344" y="365" class="body">Cost / latency budget · cache state</text>
  <line x1="344" y1="386" x2="606" y2="386" stroke="#BFDBFE"/>
  <text x="344" y="414" class="eyebrow" fill="#1D4ED8">DECIDE</text>
  <text x="344" y="440" class="body">Choose a model tier + route</text>
  <rect x="344" y="463" width="262" height="37" rx="10" fill="#DBEAFE"/>
  <circle cx="362" cy="481.5" r="5" fill="#2563EB"/>
  <text x="376" y="486" class="small" fill="#1E3A8A">Confidence score + policy threshold</text>
  <text x="344" y="529" class="small">Low confidence → clarify or escalate</text>

  <!-- Request to router -->
  <path d="M268 389 H320" class="line"/>

  <!-- Route bus and tier cards -->
  <path d="M630 388 H680 V223" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M680 223 V554" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M680 223 H718" class="route"/>
  <path d="M680 388 H718" class="route"/>
  <path d="M680 554 H718" class="route"/>

  <rect x="718" y="166" width="274" height="114" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="718" y="166" width="7" height="114" rx="3.5" fill="#0F766E"/>
  <text x="745" y="196" class="eyebrow" fill="#0F766E">LOW COMPLEXITY</text>
  <text x="745" y="224" class="card-title">Small model</text>
  <text x="745" y="249" class="small">Classification · extraction · summaries</text>
  <text x="745" y="268" class="tiny">Lowest cost and latency</text>

  <rect x="718" y="331" width="274" height="114" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="718" y="331" width="7" height="114" rx="3.5" fill="#2563EB"/>
  <text x="745" y="361" class="eyebrow" fill="#1D4ED8">MODERATE COMPLEXITY</text>
  <text x="745" y="389" class="card-title">Mid-tier model</text>
  <text x="745" y="414" class="small">Routine reasoning · writing · coding</text>
  <text x="745" y="433" class="tiny">Balanced cost and capability</text>

  <rect x="718" y="497" width="274" height="114" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="718" y="497" width="7" height="114" rx="3.5" fill="#D97706"/>
  <text x="745" y="527" class="eyebrow" fill="#B45309">HIGH COMPLEXITY / HIGH STAKES</text>
  <text x="745" y="555" class="card-title">Frontier model</text>
  <text x="745" y="580" class="small">Deep reasoning · difficult tasks</text>
  <text x="745" y="599" class="tiny">Highest capability, used selectively</text>

  <!-- Model outputs converge to validation -->
  <path d="M992 223 H1020 V388" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M992 388 H1020" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M992 554 H1020 V388" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1020 388 H1050" class="line"/>

  <!-- Validation -->
  <rect x="1050" y="304" width="216" height="168" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="1050" y="304" width="216" height="8" rx="4" fill="#7C3AED"/>
  <text x="1074" y="347" class="card-title">Validate output</text>
  <text x="1074" y="379" class="body">Quality · grounding</text>
  <text x="1074" y="404" class="body">Safety · policy checks</text>
  <line x1="1074" y1="423" x2="1242" y2="423" stroke="#E2E8F0"/>
  <text x="1074" y="448" class="small">If needed: retry up-tier</text>
  <text x="1074" y="465" class="tiny">or request human review</text>

  <!-- Response -->
  <path d="M1266 388 H1311" class="line"/>
  <rect x="1311" y="328" width="184" height="120" rx="18" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5"/>
  <circle cx="1341" cy="365" r="14" fill="#CCFBF1"/>
  <path d="M1335 365l4 4 8-9" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1364" y="371" class="card-title">Response</text>
  <text x="1334" y="406" class="small">Return the verified</text>
  <text x="1334" y="426" class="small">result to the caller.</text>

  <!-- Low-confidence handling -->
  <path d="M475 556 V608" class="line"/>
  <rect x="320" y="608" width="310" height="78" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="5 4" stroke-width="1.4"/>
  <text x="344" y="638" class="eyebrow" fill="#475569">LOW CONFIDENCE PATH</text>
  <text x="344" y="664" class="small">Clarify the request or escalate safely.</text>

  <!-- Observability and feedback loop -->
  <rect x="718" y="694" width="548" height="92" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="750" cy="727" r="15" fill="#CCFBF1"/>
  <path d="M743 730l5-6 4 4 6-8" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="778" y="728" class="card-title">Observe and improve</text>
  <text x="743" y="756" class="small">Track quality, confidence, latency, token use and cost per task.</text>
  <text x="743" y="776" class="tiny">Use evaluations and outcomes to tune policies, thresholds and model choices.</text>
  <path d="M718 740 H285 V450 H320" class="feedback"/>
  <rect x="400" y="716" width="190" height="25" rx="12.5" fill="#F7F9FC"/>
  <text x="495" y="733" text-anchor="middle" class="tiny" fill="#0F766E">evaluation + cost feedback</text>

  <!-- Footer note -->
  <text x="42" y="829" class="tiny">Illustrative flow: routing policies vary by workload, risk tolerance, available models and service-level targets.</text>
</svg>
